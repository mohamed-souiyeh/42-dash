services:
  backend:
    build: backend
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    env_file:
      - .env
    environment:
      - LAUNCH_SECRET=${LAUNCH_SECRET:-default-secret-change-me}
      - BACKEND_PORT=${BACKEND_PORT:-3000}

  postgres:
    image: postgres:16
    container_name: dashQL
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build: frontend
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    environment:
      - VITE_API_URL=http://backend:${BACKEND_PORT:-3000}
    depends_on:
      - backend

volumes:
  postgres_data:
